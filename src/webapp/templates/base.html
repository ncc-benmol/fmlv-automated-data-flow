<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FMLV Automated Data Ingestion{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <!-- Same headline typeface (din-condensed) Find My Leisure Vehicle itself loads from
       Adobe Fonts — an optional enhancement: if this is unreachable (offline VM,
       blocked domain) every rule below falls back to "Arial Narrow", a condensed
       sans that ships with Windows, so nothing breaks without it. -->
  <link rel="stylesheet" href="https://use.typekit.net/wyj4vzk.css">
  <style>
    :root {
      color-scheme: light dark;
      --border: #d0d0d0;
      --muted: #666;
      /* Find My Leisure Vehicle's own palette (findmyleisurevehicle.co.uk), sampled
         from its stylesheet: a mid olive-green brand colour, a darker green for
         banners/footers, a bright green for accents, and a pale green used across
         its search panel and input fields. */
      --brand-green: #628015;
      --brand-green-dark: #44590f;
      --brand-green-bright: #94c01f;
      --brand-green-pale: #edf4d7;
      --brand-green-pale2: #d8dfc7;
      --page-bg: #f6f8ee;
      --card-bg: #fff;
      --home-link-title: var(--brand-green-dark);
      --accept: var(--brand-green);
      --reject: #b42318;
      --correct: #9a6700;
      --bg-subtle: #f6f6f6;
      --heading-font: "din-condensed", "Arial Narrow", "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --border: #444;
        --muted: #aaa;
        --bg-subtle: #1c1c1c;
        --page-bg: #12150d;
        --card-bg: #1c1c1c;
        --accept: var(--brand-green-bright);
        --brand-green-pale: #202b10;
        --brand-green-pale2: #2b3a17;
        /* `--brand-green-dark` stays put (it's still used for the always-light
           topbar/footer, which don't flip with the theme) — headings that sit on the
           dark-mode pale-green tile need a brighter green instead, or the text
           nearly disappears against its own tile. */
        --home-link-title: var(--brand-green-bright);
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.4;
      margin: 0;
      background: var(--page-bg);
      color-scheme: inherit;
    }
    a { color: inherit; }
    h1, h2, h3 { font-family: var(--heading-font); letter-spacing: 0.01em; }
    h1 { font-size: 2rem; font-weight: 700; }
    h2 { font-size: 1.4rem; margin-top: 2rem; font-weight: 700; }
    h3 { font-size: 1.15rem; margin-bottom: 0.4rem; font-weight: 700; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
    thead th {
      background: var(--brand-green-pale);
      text-transform: uppercase;
      font-size: 0.75em;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    tbody tr:hover td { background: color-mix(in srgb, var(--brand-green) 6%, transparent); }
    .muted { color: var(--muted); font-size: 0.9em; }
    .badge {
      display: inline-block;
      font-size: 0.75em;
      padding: 0.1em 0.5em;
      border-radius: 0.3em;
      border: 1px solid var(--border);
      margin-left: 0.4em;
    }
    .badge.new { border-color: var(--accept); color: var(--accept); }
    .badge.high-suspicion { border-color: var(--correct); color: var(--correct); }
    .badge.running { border-color: var(--correct); color: var(--correct); }
    .badge.failed { border-color: var(--reject); color: var(--reject); }
    .badge.succeeded { border-color: var(--accept); color: var(--accept); }
    .product-group {
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.8rem 1rem;
      margin-bottom: 1rem;
    }
    .change-row {
      display: grid;
      grid-template-columns: 13rem 1fr auto;
      gap: 0.6rem 1rem;
      align-items: start;
      padding: 0.5rem 0;
      border-top: 1px solid var(--border);
    }
    .change-row:first-of-type { border-top: none; }
    .product-group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
    }
    .product-group-header h3 { margin: 0; }
    .accept-all-form { display: inline-block; }
    /* Same type as the other buttons (font/weight/size all inherited from .btn) — just
       less vertical padding, so it doesn't grow taller than the heading beside it and
       overlap the change-row divider directly underneath. */
    .accept-all-form .btn { padding-top: 0.3em; padding-bottom: 0.3em; }
    .field-name {
      font-weight: 600;
      /* Field names are single unbroken tokens (e.g. mh_passenger_seats_inc_driver) —
         without this, a long one overflows its grid track into the value column
         instead of wrapping, since grid items default to a content-based min-width. */
      overflow-wrap: anywhere;
      min-width: 0;
    }
    .value-diff .old { text-decoration: line-through; color: var(--muted); }
    .value-diff .new { font-weight: 600; }
    .provenance { font-size: 0.85em; color: var(--muted); margin-top: 0.2rem; }
    .provenance blockquote { margin: 0.2rem 0 0; padding-left: 0.6rem; border-left: 2px solid var(--border); }
    .decision-form { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
    .decision-form input[type="text"] { width: 8rem; }
    .decision { font-size: 0.9em; }
    .decision-accept { color: var(--accept); }
    .decision-reject { color: var(--reject); }
    .decision-correct { color: var(--correct); }
    .form-error { color: var(--reject); font-size: 0.85em; }
    #reviewer-bar { margin-bottom: 1.5rem; }
    #reviewer-bar label { font-size: 0.9em; color: var(--muted); }
    #reviewer-bar select { font: inherit; }
    /* Soft front-end guard: highlight and dim until a reviewer is picked.
       Belt-and-braces — the server rejects an unrecognised/blank reviewer regardless
       (`app.py:decide`), so this is a hint, not the enforcement. */
    #reviewer-name:invalid {
      background-color: #fff3b0;
      border-color: #b98900;
      outline: none;
      box-shadow: none;
    }
    @media (prefers-color-scheme: dark) {
      #reviewer-name:invalid {
        background-color: #6b5900;
        color: #fff3b0;
        border-color: #b98900;
      }
    }
    #reviewer-bar:has(#reviewer-name:invalid) ~ .product-group .decision-form button,
    #reviewer-bar:has(#reviewer-name:invalid) ~ .product-group .accept-all-form button {
      opacity: 0.5;
      pointer-events: none;
    }
    select:focus, input:focus, textarea:focus {
      outline: 2px solid var(--brand-green-bright);
      outline-offset: 1px;
    }

    /* Buttons — styled to match FMLV's rounded, bold-text call-to-action buttons,
       colour-coded by what the action does rather than uniformly branded: accept and
       primary actions get the brand green, reject/correct stay on their existing
       semantic colours (red/amber) so meaning isn't lost to branding. */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35em;
      font: inherit;
      font-weight: 600;
      padding: 0.5em 1.1em;
      border-radius: 0.4rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .btn-primary, .btn-accept {
      background: var(--brand-green);
      color: #fff;
    }
    .btn-primary:hover, .btn-accept:hover { background: var(--brand-green-dark); }
    .btn-reject {
      background: transparent;
      color: var(--reject);
      border-color: var(--reject);
    }
    .btn-reject:hover { background: var(--reject); color: #fff; }
    .btn-correct {
      background: transparent;
      color: var(--correct);
      border-color: var(--correct);
    }
    .btn-correct:hover { background: var(--correct); color: #fff; }

    /* Layout shell: full-bleed white header and dark-green footer bands, with the
       actual content kept in a centred card — the same "band, band, readable
       column" rhythm as findmyleisurevehicle.co.uk itself. */
    .topbar {
      /* Deliberately always light, in both themes: the FMLV wordmark's lettering is
         dark and only reads on a light plate. */
      background: #fff;
      border-bottom: 3px solid var(--brand-green);
    }
    .topbar-inner {
      max-width: 64rem;
      margin: 0 auto;
      padding: 0.7rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
    }
    .topbar .brand { display: flex; align-items: center; }
    .topbar .brand img { height: 30px; display: block; }
    .topbar nav { display: flex; gap: 1.5rem; }
    .topbar nav a {
      font-size: 0.9em;
      font-weight: 600;
      text-decoration: none;
      color: #1f2937;
      padding-bottom: 0.2rem;
      border-bottom: 2px solid transparent;
    }
    .topbar nav a:hover { color: var(--brand-green-dark); border-bottom-color: var(--brand-green); }

    .content-shell { max-width: 64rem; margin: 0 auto; padding: 1.75rem 1.5rem 3rem; }
    .content-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.75rem 2rem;
    }

    .site-footer { background: var(--brand-green-dark); color: #fff; margin-top: 2rem; }
    .site-footer a { color: #fff; }
    .footer-inner {
      max-width: 64rem;
      margin: 0 auto;
      padding: 1.1rem 1.5rem;
      font-size: 0.85em;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.4rem 1.5rem;
      opacity: 0.9;
    }

    .form-row { margin-bottom: 1rem; }
    .form-row label { display: block; font-size: 0.9em; color: var(--muted); margin-bottom: 0.2rem; }
    .form-row select, .form-row input[type="text"] {
      font: inherit;
      padding: 0.45em 0.6em;
      border-radius: 0.35rem;
      border: 1px solid var(--border);
      background: var(--brand-green-pale);
    }
    .home-links { display: flex; gap: 1rem; margin-top: 1.5rem; }
    .home-links a {
      display: block;
      background: var(--brand-green-pale);
      border: 1px solid var(--brand-green-pale2);
      border-radius: 0.5rem;
      padding: 1rem 1.2rem;
      text-decoration: none;
      flex: 1;
      transition: border-color 0.15s ease;
    }
    .home-links a:hover { border-color: var(--brand-green); }
    .home-links .title { font-weight: 700; color: var(--home-link-title); }

    /* Wider variant of .content-shell, opted into per-page (e.g. the runs table)
       via the content_shell_class block below, rather than widening every page. */
    .content-shell.wide { max-width: 84rem; }

    .run-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
    }
    .run-detail-header h1 { margin: 0; }

    .run-filter {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 0.5rem 0 1.2rem;
      font-size: 0.9em;
    }
    .run-filter a {
      text-decoration: none;
      color: var(--muted);
      padding: 0.2em 0.1em;
      border-bottom: 2px solid transparent;
    }
    .run-filter a:hover { color: inherit; }
    .run-filter select, .run-filter input[type="date"] { font: inherit; }
    .run-filter a.active {
      color: var(--brand-green-dark);
      font-weight: 600;
      border-bottom-color: var(--brand-green);
    }
    @media (prefers-color-scheme: dark) {
      .run-filter a.active { color: var(--brand-green-bright); }
    }

    /* Floating confirmation banner (`showToast()`), for actions like "generate
       upload" that shouldn't navigate the reviewer away from the page they're on. */
    .toast {
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      max-width: min(90vw, 40rem);
      background: var(--brand-green-dark);
      color: #fff;
      padding: 0.8rem 1.2rem;
      border-radius: 0.6rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      font-size: 0.95em;
      overflow-wrap: anywhere;
    }
    .toast.error { background: var(--reject); }
    .toast a { color: #fff; text-decoration: underline; }
    .toast code {
      background: rgba(255, 255, 255, 0.15);
      padding: 0.1em 0.4em;
      border-radius: 0.25em;
      user-select: all;
    }
  </style>
</head>

    <div class="footer-inner">
      <span>FMLV Automated Data Ingestion — internal NCC tool</span>
      <a href="https://findmyleisurevehicle.co.uk/" target="_blank" rel="noopener">findmyleisurevehicle.co.uk ↗</a>
    </div>
  </footer>
  <script>
    // Floating confirmation/error banner, used by generateUpload() below — kept
    // deliberately separate from HTMX's row-swapping (used for decisions) since this
    // has no single row to swap into on either the runs list or the run detail page.
    let toastTimer;
    function showToast(html, isError) {
      const toast = document.getElementById("toast");
      toast.innerHTML = html;
      toast.classList.toggle("error", Boolean(isError));
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, 10000);
    }

    // Posts a "generate upload" form via fetch instead of a normal submit, so the
    // reviewer stays on whichever page (runs list or run detail) they clicked from.
    async function generateUpload(event, form) {
      event.preventDefault();
      let data;
      try {
        const response = await fetch(form.action, {
          method: "POST",
          headers: { "Accept": "application/json" },
        });
        data = await response.json();
      } catch (err) {
        showToast("Could not reach the server to generate the upload CSV.", true);
        return;
      }
      if (!data.ok) {
        showToast(data.error || "Could not generate the upload CSV.", true);
        return;
      }
      const count = data.count === 1 ? "1 product" : `${data.count} product(s)`;
      // Plain text, not a file:// link — Chrome (and most browsers) blocks a served
      // page from navigating to a local file/folder link, so the reliable option is
      // this app's own download route instead of trying to hand off to Explorer.
      const filename = escapeHtml(data.filename);
      const downloadLink = `<a href="${data.download_url}" download>Download</a>`;
      let message = `Generated upload CSV (${count}): <code>${filename}</code> — ${downloadLink}`;
      if (data.has_errors) {
        message += " — validation errors found, check before uploading.";
      }
      showToast(message, data.has_errors);
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
